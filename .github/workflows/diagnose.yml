name: Diagnose data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diagnose.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check owner login type and sign-in settings
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -A -in worker/deploy.enc -out /tmp/d.json -pass env:DEPLOY_KEY
          pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          sa = json.load(open('/tmp/d.json'))['sa']
          pid = sa['project_id']
          c = service_account.Credentials.from_service_account_info(sa, scopes=['https://www.googleapis.com/auth/cloud-platform'])
          c.refresh(Request())
          h = {'Authorization': 'Bearer ' + c.token}
          for label, email in [('owner', 'support.sangam360@gmail.com'), ('demo', 'ksuraj.th@gmail.com')]:
              r = requests.post(f'https://identitytoolkit.googleapis.com/v1/projects/{pid}/accounts:lookup', headers=h, json={'email': [email]})
              us = r.json().get('users', []) if r.ok else []
              if not r.ok: print(f"::notice::{label} lookup failed {r.status_code}")
              for u in us:
                  print(f"::notice::{label}: providers={[x.get('providerId') for x in u.get('providerUserInfo', [])]} verified={u.get('emailVerified', False)}")
              if r.ok and not us: print(f"::notice::{label}: no account")
          r = requests.get(f'https://identitytoolkit.googleapis.com/admin/v2/projects/{pid}/config', headers=h)
          if r.ok:
              j = r.json()
              si = j.get('signIn', {})
              print(f"::notice::email/password on={si.get('email', {}).get('enabled')} oneAccountPerEmail={not si.get('allowDuplicateEmails', False)} enumProtection={j.get('emailPrivacyConfig', {}).get('enableImprovedEmailPrivacy')}")
          else:
              print(f"::notice::config read failed {r.status_code}")
          PY
          rm -f /tmp/d.json
